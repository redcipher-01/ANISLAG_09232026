name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test FileProcessing.Tests/FileProcessing.Tests.csproj --configuration Release

      - name: Build container image
        run: docker build -f FileProcessing.Api/Dockerfile -t fileprocessing-api:ci .

      - name: Start container
        run: docker run -d --name fileprocessing-api -p 8080:8080 fileprocessing-api:ci

      - name: Check health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8080/health; then
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' fileprocessing-api)" != "true" ]; then
              docker logs fileprocessing-api
              echo "Container stopped before becoming healthy."
              exit 1
            fi

            sleep 2
          done

          docker logs fileprocessing-api
          echo "Health endpoint did not become ready."
          exit 1

      - name: Check API key protection
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/files/report)
          test "$status" = "401"

      - name: Show container logs on failure
        if: failure()
        run: docker logs fileprocessing-api